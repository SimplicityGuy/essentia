name: Build Python wheels (cibuildwheel)

on: [push, pull_request]

jobs:
  build_wheels:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
        config: [cibuildwheel, cibuildwheel-tensorflow]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch release tags from GitHub
        # Workaround for https://github.com/actions/checkout/issues/290
        run: git fetch --tags --force

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          config-file: ${{ matrix.config }}.toml

      - uses: actions/upload-artifact@v6
        with:
          path: ./wheelhouse/*.whl
          name: artifact-${{ matrix.os }}-${{ matrix.config }}

  # ---------------------------------------------------------------------------------
  # sdist: publish a source distribution and verify `pip install --no-binary` builds
  # it from source against apt-provided system dependencies. See MTG/essentia#1462.
  # ---------------------------------------------------------------------------------
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch release tags from GitHub
        # Workaround for https://github.com/actions/checkout/issues/290
        run: git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the build front-end
        run: python -m pip install --upgrade build

      - name: Build the sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test_sdist:
    name: Install sdist from source / Python ${{ matrix.python-version }}
    needs: build_sdist
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - uses: actions/checkout@v6

      - name: Fetch the test audio fixtures submodule
        run: git submodule update --init test/audio

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v6
        with:
          name: sdist
          path: dist

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libeigen3-dev libyaml-dev libfftw3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libsamplerate0-dev libtag1-dev libchromaprint-dev

      - name: Install essentia from the sdist
        # ESSENTIA_WHEEL_SKIP_3RDPARTY=1 uses the apt-provided libraries above
        # instead of building static 3rdparty dependencies from source.
        env:
          ESSENTIA_WHEEL_SKIP_3RDPARTY: '1'
        run: python -m pip install --no-binary essentia dist/essentia-*.tar.gz

      - name: Import essentia.standard and decode an mp3 with MonoLoader
        run: |
          python - <<'PY'
          import glob

          import essentia.standard as es

          mp3_files = glob.glob('test/audio/**/*.mp3', recursive=True)
          assert mp3_files, 'no mp3 fixtures found under test/audio'

          audio = es.MonoLoader(filename=mp3_files[0])()
          assert len(audio) > 0, 'MonoLoader decoded 0 samples'
          print(f'Decoded {mp3_files[0]}: {len(audio)} samples')
          PY

  # Linux aarch64, on a native arm64 runner (no QEMU).
  #
  # Deliberately a separate job rather than another row of the matrix above:
  # aarch64 has to build its own static 3rdparty dependencies (there is no
  # mtgupf/essentia-builds image for it) behind a cache, and it has no
  # essentia-tensorflow counterpart yet, so the `config` axis would be
  # half-empty.
  build_wheels_linux_aarch64:
    name: ubuntu-24.04-arm / cibuildwheel
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch release tags from GitHub
        # Workaround for https://github.com/actions/checkout/issues/290
        run: git fetch --tags --force

      - name: Resolve the manylinux aarch64 builder image
        id: image
        # Read the image back out of cibuildwheel.toml so the dependency
        # prebuild below and the wheel build cannot drift apart, and so the
        # cache is invalidated when the image is bumped.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, tomllib

          with open("cibuildwheel.toml", "rb") as f:
              image = tomllib.load(f)["tool"]["cibuildwheel"]["linux"]["manylinux-aarch64-image"]

          print(f"image={image}")
          print(f"slug={re.sub(r'[^A-Za-z0-9._-]', '-', image)}")
          PY

      - name: Restore the static 3rdparty dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          # packaging/build_3rdparty_static_debian.sh installs into
          # packaging/debian_3rdparty and deletes bin/ and share/ when it is
          # done, so lib/ and include/ are the whole product. cibuildwheel
          # copies the project directory into the build container, so anything
          # restored here is visible to before-all at the same absolute path
          # (/project/packaging/debian_3rdparty) it was built at.
          path: |
            packaging/debian_3rdparty/lib
            packaging/debian_3rdparty/include
          key: essentia-3rdparty-aarch64-${{ steps.image.outputs.slug }}-${{ hashFiles('packaging/build_config.sh', 'packaging/build_3rdparty_static_debian.sh', 'packaging/build_3rdparty_static_aarch64_manylinux.sh', 'packaging/debian_3rdparty/build_*.sh') }}

      - name: Build the static 3rdparty dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        # Built in the same image cibuildwheel will use, bind-mounted at the
        # same path (/project) cibuildwheel uses, because the generated .pc
        # files record absolute paths. Around 25 minutes cold; the cache above
        # makes a warm run skip this step entirely.
        run: |
          docker run --rm \
            --volume "$PWD":/project \
            --workdir /project \
            "${{ steps.image.outputs.image }}" \
            ./packaging/build_3rdparty_static_aarch64_manylinux.sh
          sudo chown -R "$(id -u):$(id -g)" packaging/debian_3rdparty

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          config-file: cibuildwheel.toml

      - uses: actions/upload-artifact@v6
        with:
          path: ./wheelhouse/*.whl
          name: artifact-ubuntu-24.04-arm-cibuildwheel

      - name: Check out the test audio
        run: git submodule update --init --depth 1 test/audio

      - name: Decode audio with the cp312 wheel on arm64v8/python:3.12-slim
        # End-to-end check on a stock arm64 Debian image rather than the
        # manylinux builder: the wheel has to install and decode MP3s with no
        # system FFmpeg, no libessentia and no build toolchain present.
        run: |
          docker run --rm \
            --volume "$PWD":/w \
            --workdir /w \
            arm64v8/python:3.12-slim \
            bash -euxo pipefail -c 'pip install --no-cache-dir wheelhouse/essentia-*-cp312-cp312-manylinux*_aarch64.whl && python packaging/verify_wheel_audio.py test/audio/recorded/*.mp3'
